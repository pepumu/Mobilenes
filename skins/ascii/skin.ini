; =============================================================================
;  Mobilenes SKIN FILE  -  the Famicube gamepad
; =============================================================================
;  This text file describes a whole gamepad: the pictures, where each button
;  is, how big its touch area is, which keys it uses, and whether it is turbo.
;
;  HOW TO MAKE YOUR OWN SKIN
;    1. Copy this whole folder and give the copy a new name.
;    2. Put your own PNG pictures in your copy.
;    3. Edit skin.ini in your copy (change the file names and numbers).
;    4. Open the Mobilenes menu in the game and pick your skin. (Or select your
;       Mobilenes node and set "Skin Folder" to your new folder.)
;       Skin folders placed inside addons/mobilenes/skins show up in the menu.
;
;  RULES
;    * Lines starting with ; are comments. Mobilenes ignores them.
;    * Write  name = value  . Quotes around values are not needed.
;    * Everything is measured in PIXELS inside the skin's own layout.
;      The layout is "width" x "height" (below). 0,0 is the top-left corner.
;    * x and y always mean the CENTER of a picture.
;    * Pictures are drawn in the order they appear in this file
;      (first = at the back, last = in front).
;    * If something is wrong, Mobilenes shows a yellow warning in Godot's Output
;      panel with the line number, and skips that entry.
; =============================================================================


; -----------------------------------------------------------------------------
;  [skin]  - general information
; -----------------------------------------------------------------------------
[skin]
name = Famicube Sides

; Color of the red "M" circle you pull from the top-left corner to open the menu (NES red).
menu_color = e4002b

; Size of the whole layout. Here: 128 pixels of pad, the 256 pixel game screen,
; and 128 pixels of pad again.
width = 512
height = 240

; Where the top-left corner of the 256 x 240 game screen sits in the layout.
screen_x = 128
screen_y = 0
screen_width = 640
screen_height = 400

; SIDES layout: the left panel (x 0-128) and the right panel (x 384-512) grow to fill the space beside the game.
layout = sides
left_width = 128
right_start = 384

; The picture drawn behind everything (centered automatically).
background = body.png

; A small picture showing what the skin looks like (optional).
preview = preview.png


; -----------------------------------------------------------------------------
;  [picture NAME]  - extra pictures that only decorate (they cannot be touched)
;  The NAME is just for you.
; -----------------------------------------------------------------------------
[picture label_bars]
image = label_bars.png
x = 448
y = 52

[picture start_select_plate]
image = pill_plate.png
x = 448
y = 114

[picture b_frame]
image = round_button_frame.png
x = 417
y = 191

[picture a_frame]
image = round_button_frame.png
x = 479
y = 191


; -----------------------------------------------------------------------------
;  [dpad]  - the direction cross (up, down, left, right and diagonals)
; -----------------------------------------------------------------------------
[dpad]
image = dpad.png
x = 63
y = 157

; The REAL touch area: where a finger counts as pressing the cross.
; touch_x / touch_y = the CENTER of the area. If you leave them out, the area
; is centered on the picture. touch_width / touch_height = its size.
; (Make it a bit bigger than the picture so thumbs have an easy time.)
touch_x = 63
touch_y = 157
touch_width = 136
touch_height = 150

; How far from the middle (in percent) before a direction counts.
dead_zone = 25

; Keyboard keys and gamepad buttons for each direction. Separate several with
; commas. Delete a line to keep the default keys.
up_keys = Up, W
up_gamepad = DpadUp
down_keys = Down, S
down_gamepad = DpadDown
left_keys = Left, A
left_gamepad = DpadLeft
right_keys = Right, D
right_gamepad = DpadRight


; -----------------------------------------------------------------------------
;  [button NAME]  - one button
;  The NAME decides which game action it presses: [button a] presses pad_a,
;  [button start] presses pad_start, and so on. You may invent your own names
;  (for example [button x] presses pad_x) - or choose the action yourself with
;  a line like:  action = my_custom_action
;
;    image         = picture of the button
;    pressed_image = picture shown while it is held (optional)
;    x, y          = CENTER of the picture
;    touch_x/y     = CENTER of the touch area (optional, default = x, y)
;    touch_width / touch_height = size of the touch area
;                    (optional, default = size of the picture)
;    keys          = keyboard keys, separated by commas (optional)
;    gamepad       = gamepad buttons, separated by commas (optional)
;    turbo         = true / false  (true = holding it repeats it quickly)
; -----------------------------------------------------------------------------
[button b]
image = round_button.png
pressed_image = round_button_pressed.png
x = 417
y = 190
touch_x = 417
touch_y = 190
touch_width = 62
touch_height = 76
keys = Z, J
gamepad = B
turbo = false

[button a]
image = round_button.png
pressed_image = round_button_pressed.png
x = 479
y = 190
touch_x = 479
touch_y = 190
touch_width = 62
touch_height = 76
keys = X, K
gamepad = A
turbo = false

[button select]
image = pill_button.png
pressed_image = pill_button_pressed.png
x = 420.5
y = 114.5
touch_width = 54
touch_height = 30
keys = Backspace, Shift
gamepad = Back
turbo = false

[button start]
image = pill_button.png
pressed_image = pill_button_pressed.png
x = 475.5
y = 114.5
touch_width = 54
touch_height = 30
keys = Enter
gamepad = Start
turbo = false


