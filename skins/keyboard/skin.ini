; =============================================================================
;  Mobilenes SKIN FILE  -  the keyboard
; =============================================================================
;  A numeric keypad on the left; F4, F5, Alt, Ctrl and a space bar on the right.
;  Every key presses its own action (pad_kp_7, pad_f4, pad_space ...), and the
;  real keyboard key of the same name presses it too. A game maps these actions
;  to its own buttons.
;
;  The keys are ONE small keycap picture stretched as a 9-patch:
;    width / height = the size the key is drawn at
;    patch          = left, top, right, bottom: the borders kept as drawn
;                     (only the middle of the picture stretches)
;    legend         = a small picture drawn on the key, at legend_x, legend_y
;                     from the key's top-left corner (it sinks with the key)
;  See the ascii skin's skin.ini for every other setting.
; =============================================================================

[skin]
name = Keyboard
menu_color = e4002b
width = 512
height = 240
screen_x = 128
screen_y = 0
screen_width = 640
screen_height = 400
layout = sides
left_width = 128
right_start = 384
background = body.png
; One picture behind the game, filling the window; it shows above and below the game.
screen_background = screen_background.png
preview = preview.png

; The dark recesses the keys sit in.
[picture well_left]
image = well_left.png
x = 63.5
y = 119.5

